<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ARTWarchive</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="https://unpkg.com/pretendard-jp@1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.css" />
<link rel="stylesheet" href="css/style.css?v=25" />
<script>
  // 로딩 화면을 최소 1초는 보여주기 위한 기준 시각. firebase-config.js는 ES
  // 모듈이라 import가 끝나야 실행되는데, 그 안에서 시각을 재면 이미 import
  // 로딩 시간만큼 늦게 잰 게 되어버린다. 그래서 아무것도 기다리지 않는 이
  // 스크립트(페이지 파싱 중 가장 먼저 실행됨)에서 미리 기록해두고,
  // app.js가 로그인 여부 확인을 끝냈을 때 이 값과 비교해서 필요하면 조금
  // 더 기다린다.
  window.__pageLoadStart = Date.now();
</script>
</head>
<body>

<!-- 로딩 화면. 로그인 상태를 아직 확인 중일 때(새로고침, 뒤로가기 등) 잠깐
     보여준다 — 이게 없으면 로그인 화면이 잠깐 번쩍이고 사라진다 (Firebase가
     "이미 로그인되어 있다"는 걸 확인하는 데도 시간이 걸리기 때문). 로그인
     여부가 확인되면 app.js가 이 화면을 숨기고 맞는 화면(로그인 폼 또는 앱
     화면)을 보여준다. -->
<div id="loading-view" class="loading-view">
  <div class="loading-content">
    <p class="loading-dots-text">Loading<span id="loading-dots" class="loading-dots"></span></p>
    <img id="loading-image" class="loading-image" alt="" hidden />
  </div>
</div>
<script>
  // 점 3개가 하나씩 늘었다 다시 0개로 돌아가는 애니메이션과, 이미지를 2초마다
  // 무작위로 바꾸는 동작을 여기서 바로 시작한다. app.js는 ES 모듈이라 import가
  // 전부 끝나야 실행되는데, 이 로딩 화면은 정확히 그 기다리는 동안 보여주는
  // 화면이라 그 실행을 기다리면 안 된다 — 그래서 이 스크립트는 일반 스크립트로
  // 두고 페이지가 파싱되는 즉시 바로 시작한다.
  (function () {
    var LOADING_IMAGES = [
      'images/loading/1.webp',
      'images/loading/2.webp',
      'images/loading/3.webp',
      'images/loading/4.webp',
      'images/loading/5.webp',
      'images/loading/6.webp'
    ];
    // 그냥 무작위로 src만 바꾸면 처음 등장하는 순간마다 그제서야 네트워크
    // 요청이 나가서 화면이 잠깐 멈춘 것처럼 보이는데, new Image()로 미리
    // 받아두면 브라우저 캐시에 이미 있어서 2초마다 바뀔 때 끊김 없이 바로
    // 표시된다.
    LOADING_IMAGES.forEach(function (src) {
      var preload = new Image();
      preload.src = src;
    });

    var dotsEl = document.getElementById('loading-dots');
    var dotsCount = 0;
    function renderDots() {
      dotsEl.textContent = '.'.repeat(dotsCount);
    }
    renderDots();
    setInterval(function () {
      dotsCount = (dotsCount + 1) % 4;
      renderDots();
    }, 350);

    var imgEl = document.getElementById('loading-image');
    function pickRandomLoadingImage() {
      var idx = Math.floor(Math.random() * LOADING_IMAGES.length);
      imgEl.src = LOADING_IMAGES[idx];
      imgEl.hidden = false;
    }
    pickRandomLoadingImage();
    setInterval(pickRandomLoadingImage, 2000);
  })();
</script>

<!-- 로그인 화면 -->
<div id="login-screen" class="hidden">
  <div id="login-box">
    <h1>ARTWarchive</h1>
    <input type="password" id="login-password" placeholder="비밀번호" />
    <button id="login-btn">로그인</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- 앱 본체 -->
<div id="app-shell" class="hidden">
  <button id="sidebar-toggle-btn" aria-label="메뉴 열기">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18" /><path d="M3 12h18" /><path d="M3 19h18" /></svg>
  </button>
  <img id="site-logo" src="images/logo.webp" alt="Arcana Twilight" />
  <div id="site-subtitle">ARCHIVE</div>
  <div id="sidebar-backdrop"></div>

  <nav id="sidebar">
    <div class="sidebar-nav-group">
      <div id="category-nav"></div>
      <button id="library-nav-btn" data-admin-only class="hidden">캐릭터 라이브러리 관리</button>
    </div>
    <div class="sidebar-footer">
      <button id="sidebar-mode-btn" class="sidebar-mode-btn">
        <span>@ae0niandreams</span><span id="sidebar-admin-badge" class="hidden"> · 관리자 모드</span>
      </button>
      <button id="sidebar-logout-btn" class="sidebar-logout-btn" aria-label="로그아웃">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 17 5-5-5-5" /><path d="M21 12H9" /><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /></svg>
      </button>
    </div>
  </nav>

  <main id="main-area">

    <!-- 홈 화면 -->
    <section id="home-view"></section>

    <!-- 리스트 화면 -->
    <section id="list-view" class="hidden">
      <img id="list-logo" src="images/logo.webp" alt="Arcana Twilight" />
      <div class="breadcrumb" id="list-breadcrumb"></div>
      <button id="new-record-btn" data-admin-only class="hidden">+ 새 기록 추가</button>
      <ul class="record-list" id="record-list"></ul>
    </section>

    <!-- 에디터 화면 -->
    <section id="editor-view" class="hidden">
      <div class="breadcrumb" id="editor-breadcrumb"></div>

      <div class="field-row">
        <input type="text" id="record-title" placeholder="제목" />
      </div>
      <div class="field-row">
        <select id="record-category"></select>
        <select id="record-subcategory"></select>
      </div>

      <div id="editor-toolbar" class="editor-toolbar">
        <button type="button" data-cmd="bold"><b>B</b></button>
        <button type="button" data-cmd="italic"><i>I</i></button>
        <input type="color" id="color-picker" title="글자색" />
        <button type="button" id="btn-insert-table">대화 표 삽입</button>
        <button type="button" id="btn-add-row">행 추가</button>
        <button type="button" data-quick="/접기">접기</button>
        <button type="button" data-quick="/끝">접기 끝</button>
        <button type="button" data-quick="/표">표 유지</button>
        <button type="button" id="btn-paste-html">HTML 붙여넣기</button>
      </div>
      <div id="editor-content" contenteditable="true"></div>

      <button id="save-record-btn">저장</button>
    </section>

    <!-- 뷰어 화면 -->
    <section id="viewer-view" class="hidden">
      <div class="breadcrumb" id="viewer-breadcrumb"></div>
      <h2 id="viewer-title"></h2>
      <div id="viewer-content" class="log-render"></div>
    </section>

    <!-- 캐릭터 라이브러리 관리 화면 -->
    <section id="library-view" class="hidden">
      <img class="page-logo" src="images/logo.webp" alt="Arcana Twilight" />
      <div class="breadcrumb"><a href="#/home" aria-label="홈으로">&larr;</a></div>
      <h2>캐릭터 라이브러리 관리</h2>
      <p class="page-desc">여기서 등록한 이름·사진은 모든 기록에 공통으로 적용됩니다. 기록을 쓸 때마다 다시 넣지 않아도 돼요.</p>

      <div id="library-toolbar" class="editor-toolbar">
        <button type="button" id="btn-library-insert-table">라이브러리 표 삽입</button>
        <button type="button" id="btn-library-add-character">캐릭터 칸 추가</button>
        <button type="button" id="btn-library-insert-image">이미지 추가</button>
        <button type="button" id="btn-library-paste-html">HTML 붙여넣기</button>
      </div>
      <div id="library-content" contenteditable="true"></div>

      <button id="save-library-btn">저장</button>
    </section>

  </main>
</div>

<!-- HTML 붙여넣기 모달 -->
<div id="paste-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100;">
  <div style="background:white;padding:20px;border-radius:8px;width:600px;max-width:90vw;">
    <h3 style="margin-top:0;">기존 티스토리 표 HTML 붙여넣기</h3>
    <textarea id="paste-textarea" style="width:100%;height:200px;"></textarea>
    <div style="margin-top:10px;text-align:right;">
      <button id="paste-cancel-btn">취소</button>
      <button id="paste-confirm-btn">삽입</button>
    </div>
  </div>
</div>

<!-- 관리자 모드 비밀번호 확인 -->
<div id="admin-password-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100;">
  <div style="background:white;padding:32px 28px;border-radius:12px;width:320px;max-width:90vw;text-align:center;">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="30" height="30" style="margin-bottom:8px;"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /><path d="m9 12 2 2 4-4" /></svg>
    <h3 style="margin:0 0 4px;">관리자 모드</h3>
    <p style="margin:0 0 14px;color:var(--text-dim);font-size:0.85rem;">관리자 비밀번호를 입력해 주세요</p>
    <input type="password" id="admin-password-input" placeholder="비밀번호" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid var(--border);border-radius:6px;text-align:center;" />
    <button id="admin-password-submit-btn" style="width:100%;padding:10px;border:none;border-radius:6px;background:var(--accent);color:white;font-weight:bold;cursor:pointer;">확인</button>
    <div id="admin-password-error" style="color:#c0392b;font-size:0.8rem;margin-top:8px;min-height:1em;"></div>
    <button id="admin-password-cancel-btn" style="margin-top:10px;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:0.8rem;">취소</button>
  </div>
</div>

<script type="module" src="js/app.js?v=25"></script>
</body>
</html>
